<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hermit Project Status Tracker</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

    :root {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(51, 65, 85, 0.5);
    }

    .glass-card-hover {
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-card-hover:hover {
      transform: translateY(-2px);
      border-color: rgba(16, 185, 129, 0.4);
      box-shadow: 0 16px 32px -8px rgba(0, 0, 0, 0.5), 0 0 16px -2px rgba(16, 185, 129, 0.15);
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.6); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.8); }

    .circle-bg { stroke: rgba(51, 65, 85, 0.4); }
    .circle-fill {
      transition: stroke-dashoffset 0.5s ease-in-out;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
      stroke-linecap: round;
    }

    /* Modal Backdrop */
    .modal-backdrop {
      background: rgba(2, 6, 23, 0.8);
      backdrop-filter: blur(8px);
    }

    @media print {
      body { background: white !important; color: black !important; }
      .no-print { display: none !important; }
      .glass-card { background: white !important; border: 1px solid #cbd5e1 !important; color: black !important; }
    }
  </style>
</head>
<body class="h-full flex overflow-hidden selection:bg-emerald-500/20 selection:text-emerald-300">

  <!-- ==================== SIDEBAR ==================== -->
  <!-- Sidebar Backdrop for Mobile -->
  <div id="sidebar-backdrop" onclick="toggleSidebar(false)" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-30 hidden lg:hidden transition-opacity duration-300 opacity-0"></div>

  <!-- ==================== SIDEBAR ==================== -->
  <aside id="main-sidebar" class="fixed inset-y-0 left-0 z-40 w-72 bg-slate-900/95 border-r border-slate-800 flex flex-col flex-shrink-0 backdrop-blur-xl transition-transform duration-300 ease-in-out -translate-x-full lg:translate-x-0 lg:static">
    <!-- Brand / Header -->
    <div class="h-20 border-b border-slate-800 flex items-center justify-between px-6">
      <div class="flex items-center gap-3.5">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 via-teal-600 to-cyan-700 flex items-center justify-center shadow-lg shadow-emerald-500/20 ring-1 ring-white/20">
          <i data-lucide="leaf" class="w-5 h-5 text-white stroke-[2.5]"></i>
        </div>
        <div>
          <div class="font-bold text-xs tracking-widest text-white leading-tight whitespace-nowrap">
            HERMIT PROJECT
          </div>
          <div class="text-[10px] tracking-widest text-emerald-400 font-semibold uppercase">
            Status Tracker
          </div>
        </div>
      </div>
      <button onclick="toggleSidebar(false)" class="lg:hidden p-1.5 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto">
      <div class="px-3 py-2 text-[11px] font-semibold tracking-wider text-slate-400 uppercase">Executive Views</div>

      <button onclick="setTab('overview')" id="nav-overview" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-all text-slate-300 hover:bg-slate-800/80 hover:text-white">
        <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
        <span>Portfolio Executive</span>
      </button>

      <button onclick="setTab('projects')" id="nav-projects" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-all text-slate-300 hover:bg-slate-800/80 hover:text-white">
        <i data-lucide="layers" class="w-4 h-4"></i>
        <span>Projects Register</span>
        <span class="ml-auto text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 font-mono" id="nav-proj-count">12</span>
      </button>

      <button onclick="setTab('timeline')" id="nav-timeline" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-all text-slate-300 hover:bg-slate-800/80 hover:text-white">
        <i data-lucide="calendar-range" class="w-4 h-4"></i>
        <span>Gantt & Roadmap</span>
      </button>

      <button onclick="setTab('tasks')" id="nav-tasks" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-all text-slate-300 hover:bg-slate-800/80 hover:text-white">
        <i data-lucide="check-square" class="w-4 h-4"></i>
        <span>Deliverables & Tasks</span>
        <span class="ml-auto text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 font-mono" id="nav-task-count">0</span>
      </button>

      <div class="pt-4 px-3 py-2 text-[11px] font-semibold tracking-wider text-slate-400 uppercase">Governance & Risks</div>

      <button onclick="setTab('alerts')" id="nav-alerts" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-all text-slate-300 hover:bg-slate-800/80 hover:text-white relative">
        <i data-lucide="shield-alert" class="w-4 h-4 text-rose-400"></i>
        <span>Risk & Blockers</span>
        <span class="ml-auto flex items-center justify-center h-5 px-2 text-[11px] font-bold rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/30 font-mono" id="nav-crit-badge">3 Critical</span>
      </button>

      <button onclick="setTab('funding')" id="nav-funding" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-all text-slate-300 hover:bg-slate-800/80 hover:text-white">
        <i data-lucide="landmark" class="w-4 h-4 text-amber-400"></i>
        <span>Capital & Partnerships</span>
      </button>
    </nav>

    <!-- Project Actions Bottom Panel -->
    <div class="p-4 border-t border-slate-800 bg-slate-950/40 space-y-2">
      <button onclick="openNewProjectModal()" class="w-full flex items-center justify-center gap-2 px-3.5 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold shadow-lg shadow-emerald-600/20 transition-all">
        <i data-lucide="plus-circle" class="w-4 h-4"></i>
        <span>Add New Project</span>
      </button>

      <button onclick="resetToInitialData()" class="w-full flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-800/60 hover:bg-slate-800 text-slate-400 hover:text-slate-300 text-[11px] font-medium transition-all">
        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
        <span>Reset to Default Data</span>
      </button>
    </div>
  </aside>

  <!-- ==================== MAIN WORKSPACE ==================== -->
  <div class="flex-1 flex flex-col h-full overflow-hidden bg-slate-950">
    
    <!-- Top Action Bar -->
    <header class="min-h-20 border-b border-slate-800 bg-slate-900/60 backdrop-blur-xl px-4 lg:px-8 py-3 flex flex-wrap items-center justify-between gap-4 flex-shrink-0 z-10">
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar(true)" class="lg:hidden p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-200 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
        <div>
          <h1 class="text-base lg:text-lg font-bold text-white tracking-tight flex items-center gap-2" id="page-title">
            Executive Portfolio Dashboard
          </h1>
          <p class="text-xs text-slate-400 mt-0.5 hidden sm:block" id="page-subtitle">Cross-project operational metrics, deliverables tracking & risk surveillance.</p>
        </div>
      </div>

      <!-- Controls -->
      <div class="flex flex-wrap items-center gap-2 sm:gap-3 w-full lg:w-auto">
        <!-- Live Saving Indicator -->
        <span id="save-indicator" class="text-[11px] font-semibold text-emerald-400 flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20">
          <i data-lucide="check" class="w-3 h-3"></i> Auto-Saved
        </span>

        <!-- Global Search -->
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
          <input 
            type="text" 
            id="global-search"
            placeholder="Search projects, tasks, owners..." 
            oninput="handleSearch(this.value)"
            class="w-60 pl-9 pr-3.5 py-2 text-xs rounded-lg bg-slate-900 border border-slate-700/80 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all font-medium"
          />
        </div>

        <!-- Filter Dropdown -->
        <select id="status-filter" onchange="applyFilters()" class="text-xs py-2 px-3 rounded-lg bg-slate-900 border border-slate-700/80 text-slate-300 focus:outline-none focus:border-emerald-500 font-medium">
          <option value="ALL">All Health Statuses</option>
          <option value="CRITICAL">🔴 Critical Risk</option>
          <option value="WARNING">🟡 Needs Attention</option>
          <option value="HEALTHY">🟢 On Track</option>
        </select>

        <!-- Export Action -->
        <button onclick="window.print()" class="flex items-center gap-2 px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-slate-200 transition-all">
          <i data-lucide="printer" class="w-3.5 h-3.5"></i>
          <span>Print / PDF</span>
        </button>

        <button onclick="exportExcelXLSX()" class="flex items-center gap-2 px-3.5 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold shadow-lg shadow-emerald-600/20 transition-all" title="Export Executive Excel Spreadsheet with Data Bars (.xlsx)">
          <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5"></i>
          <span>Export Excel</span>
        </button>
        <button onclick="exportCSV()" class="flex items-center gap-1.5 px-2.5 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold border border-slate-700 transition-all" title="Export Raw CSV">
          <i data-lucide="download" class="w-3 h-3"></i>
          <span class="hidden sm:inline">CSV</span>
        </button>
      </div>
    </header>

    <!-- Main Dynamic Content Container -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8" id="viewport">
      <!-- Injected by JavaScript -->
    </main>

  </div>

  <!-- ==================== MODAL: ADD / EDIT TASK ==================== -->
  <div id="task-modal" class="fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4 hidden">
    <div class="glass-card bg-slate-900 rounded-2xl border border-slate-700 max-w-lg w-full p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <h3 class="text-sm font-bold text-white flex items-center gap-2" id="task-modal-title">
          <i data-lucide="plus-circle" class="w-4 h-4 text-emerald-400"></i> Add New Deliverable
        </h3>
        <button onclick="closeTaskModal()" class="text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <form id="task-form" onsubmit="saveTaskForm(event)" class="space-y-3.5 text-xs">
        <input type="hidden" id="task-form-project-id" />
        <input type="hidden" id="task-form-task-index" value="-1" />

        <div>
          <label class="block text-slate-300 font-medium mb-1">Deliverable / Task Name *</label>
          <input type="text" id="task-form-name" required placeholder="e.g. Environmental Prospectus Report" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-slate-200 focus:outline-none focus:border-emerald-500 font-medium" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-300 font-medium mb-1">Task Owner *</label>
            <input type="text" id="task-form-owner" required placeholder="e.g. Eng Murove / Hermit Team" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-slate-200 focus:outline-none focus:border-emerald-500 font-medium" />
          </div>
          <div>
            <label class="block text-slate-300 font-medium mb-1">Due Date</label>
            <input type="text" id="task-form-due" placeholder="e.g. 2026-12-15 or TBC" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-slate-200 focus:outline-none focus:border-emerald-500 font-mono" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-300 font-medium mb-1">Current Status</label>
            <select id="task-form-status" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-slate-200 focus:outline-none focus:border-emerald-500 font-medium">
              <option value="Not Started">Not Started</option>
              <option value="In Progress">In Progress</option>
              <option value="Needs Review">Needs Review</option>
              <option value="Complete">Complete</option>
              <option value="Approved">Approved</option>
              <option value="Overdue">Overdue</option>
              <option value="On Hold">On Hold</option>
            </select>
          </div>
          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="text-slate-300 font-medium">Progress: <span id="task-form-pct-label" class="text-emerald-400 font-mono font-bold">0%</span></label>
            </div>
            <input type="range" id="task-form-pct" min="0" max="100" value="0" oninput="document.getElementById('task-form-pct-label').textContent = this.value + '%'" class="w-full accent-emerald-500 cursor-pointer" />
          </div>
        </div>

        <div class="pt-3 border-t border-slate-800 flex justify-end gap-2.5">
          <button type="button" onclick="closeTaskModal()" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold shadow-lg shadow-emerald-600/20">Save Deliverable</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==================== MODAL: ADD NEW PROJECT ==================== -->
  <div id="project-modal" class="fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4 hidden">
    <div class="glass-card bg-slate-900 rounded-2xl border border-slate-700 max-w-lg w-full p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <h3 class="text-sm font-bold text-white flex items-center gap-2">
          <i data-lucide="folder-plus" class="w-4 h-4 text-emerald-400"></i> Register New Project Mandate
        </h3>
        <button onclick="closeNewProjectModal()" class="text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <form id="project-form" onsubmit="saveNewProjectForm(event)" class="space-y-3.5 text-xs">
        <div>
          <label class="block text-slate-300 font-medium mb-1">Project Name *</label>
          <input type="text" id="new-proj-name" required placeholder="e.g. Osborne Dam Floating Solar" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-slate-200 focus:outline-none focus:border-emerald-500 font-medium" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-300 font-medium mb-1">Project Code / ID *</label>
            <input type="text" id="new-proj-id" required placeholder="e.g. OSBORNE-FSPV" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-slate-200 focus:outline-none focus:border-emerald-500 font-mono uppercase" />
          </div>
          <div>
            <label class="block text-slate-300 font-medium mb-1">Client / Offtaker *</label>
            <input type="text" id="new-proj-client" required placeholder="e.g. ZINWA / ZERA" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-slate-200 focus:outline-none focus:border-emerald-500 font-medium" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-300 font-medium mb-1">Asset Category</label>
            <select id="new-proj-cat" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-slate-200 focus:outline-none focus:border-emerald-500 font-medium">
              <option value="Renewable Energy">Renewable Energy</option>
              <option value="Solar Energy">Solar Energy</option>
              <option value="Storage & Grid">Storage & Grid</option>
              <option value="Hybrid Generation">Hybrid Generation</option>
              <option value="Policy & Sovereign">Policy & Sovereign</option>
              <option value="Commercial & Industrial">Commercial & Industrial</option>
              <option value="Capital & Co-Dev">Capital & Co-Dev</option>
              <option value="Circular & Waste">Circular & Waste</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-300 font-medium mb-1">Lead Engineer / Owner *</label>
            <input type="text" id="new-proj-lead" required placeholder="e.g. Eng Murove" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-slate-200 focus:outline-none focus:border-emerald-500 font-medium" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-300 font-medium mb-1">Priority</label>
            <select id="new-proj-priority" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-slate-200 focus:outline-none focus:border-emerald-500 font-medium">
              <option value="High">High</option>
              <option value="Medium">Medium</option>
              <option value="Low">Low</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-300 font-medium mb-1">Estimated Hours</label>
            <input type="number" id="new-proj-hours" placeholder="e.g. 500" value="250" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-slate-200 focus:outline-none focus:border-emerald-500 font-mono" />
          </div>
        </div>

        <div>
          <label class="block text-slate-300 font-medium mb-1">Project Scope & Summary</label>
          <textarea id="new-proj-desc" rows="2" placeholder="Brief project summary, regulatory objectives, and targets..." class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-slate-200 focus:outline-none focus:border-emerald-500 font-medium"></textarea>
        </div>

        <div class="pt-3 border-t border-slate-800 flex justify-end gap-2.5">
          <button type="button" onclick="closeNewProjectModal()" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold shadow-lg shadow-emerald-600/20">Create Project Mandate</button>
        </div>
      </form>
    </div>
  </div>

    // --- State Persistence via localStorage ---
    const STORAGE_KEY = "HERMIT_PORTFOLIO_DATA_V1";
    let PORTFOLIO_DATA = [];

    function loadData() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try {
          PORTFOLIO_DATA = JSON.parse(stored);
        } catch (e) {
          PORTFOLIO_DATA = JSON.parse(JSON.stringify(INITIAL_PORTFOLIO_DATA));
        }
      } else {
        PORTFOLIO_DATA = JSON.parse(JSON.stringify(INITIAL_PORTFOLIO_DATA));
      }
      recalculateAllProgress();
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(PORTFOLIO_DATA));
      flashSaveIndicator();
      updateSidebarBadges();
    }

    function flashSaveIndicator() {
      const el = document.getElementById("save-indicator");
      if (!el) return;
      el.classList.remove("opacity-50");
      el.innerHTML = `<i data-lucide="check" class="w-3 h-3"></i> Saved just now`;
      lucide.createIcons();
      setTimeout(() => {
        el.classList.add("opacity-70");
      }, 1500);
    }

    function resetToInitialData() {
      if (confirm("Reset all projects, tasks, and progress to default initial data? This will clear local edits.")) {
        PORTFOLIO_DATA = JSON.parse(JSON.stringify(INITIAL_PORTFOLIO_DATA));
        saveData();
        render();
      }
    }

    // --- Auto-Recalculate Project Overall Progress from Tasks ---
    function recalculateProjectProgress(project) {
      if (!project.tasks || project.tasks.length === 0) {
        project.completion = 0;
        return;
      }
      const totalPct = project.tasks.reduce((sum, t) => sum + (Number(t.pct) || 0), 0);
      project.completion = Math.round(totalPct / project.tasks.length);

      // Re-evaluate health automatically if not explicitly locked
      const overdueCount = project.tasks.filter(t => t.status === "Overdue").length;
      if (overdueCount >= 2) {
        project.health = "CRITICAL";
      } else if (overdueCount === 1 || project.completion < 40) {
        project.health = "WARNING";
      } else {
        project.health = "HEALTHY";
      }
    }

    function recalculateAllProgress() {
      PORTFOLIO_DATA.forEach(p => recalculateProjectProgress(p));
    }

    // --- Navigation & View State ---
    let currentTab = "overview";
    let selectedProjectId = null;
    let searchQuery = "";
    let healthFilter = "ALL";

    // --- Mobile Drawer Controller & Gestures ---
    function toggleSidebar(open) {
      const sidebar = document.getElementById("main-sidebar");
      const backdrop = document.getElementById("sidebar-backdrop");
      if (!sidebar || !backdrop) return;

      if (open) {
        sidebar.classList.remove("-translate-x-full");
        backdrop.classList.remove("hidden");
        // Fade in backdrop
        requestAnimationFrame(() => {
          backdrop.classList.remove("opacity-0");
          backdrop.classList.add("opacity-100");
        });
      } else {
        sidebar.classList.add("-translate-x-full");
        backdrop.classList.remove("opacity-100");
        backdrop.classList.add("opacity-0");
        setTimeout(() => {
          backdrop.classList.add("hidden");
        }, 300);
      }
    }

    // Touch gesture swipe support (swipe right from left edge to open, swipe left anywhere on sidebar to close)
    let touchStartX = 0;
    let touchStartY = 0;

    document.addEventListener("touchstart", (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    document.addEventListener("touchend", (e) => {
      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;
      const diffX = touchEndX - touchStartX;
      const diffY = Math.abs(touchEndY - touchStartY);

      // Only trigger if horizontal swipe is dominant (> 40px horizontal and < 60px vertical drift)
      if (diffY < 80) {
        // Swipe right from left edge (< 40px from screen edge) -> Open sidebar
        if (touchStartX < 40 && diffX > 50) {
          toggleSidebar(true);
        }
        // Swipe left on open sidebar -> Close sidebar
        else if (diffX < -50) {
          const sidebar = document.getElementById("main-sidebar");
          if (sidebar && !sidebar.classList.contains("-translate-x-full")) {
            toggleSidebar(false);
          }
        }
      }
    }, { passive: true });

    function setTab(tabName) {
      currentTab = tabName;
      selectedProjectId = null;
      
      // Auto-close sidebar on mobile selection
      if (window.innerWidth < 1024) {
        toggleSidebar(false);
      }

      document.querySelectorAll("aside button").forEach(btn => {
        btn.classList.remove("bg-emerald-500/10", "text-emerald-300", "border-emerald-500/30", "border");
      });
      const activeBtn = document.getElementById("nav-" + tabName);
      if (activeBtn) {
        activeBtn.classList.add("bg-emerald-500/10", "text-emerald-300", "border-emerald-500/30", "border");
      }

      const titles = {
        overview: ["Executive Portfolio Dashboard", "Consolidated performance indices, risk heatmaps and capital readiness."],

        document.getElementById("page-title").textContent = titles[tabName][0];
        document.getElementById("page-subtitle").textContent = titles[tabName][1];
      }

      render();

    // --- In-Line Editing Controls ---
    function updateTaskStatus(projectId, taskIndex, newStatus) {
      const project = PORTFOLIO_DATA.find(p => p.id === projectId);
      if (!project || !project.tasks[taskIndex]) return;

      const task = project.tasks[taskIndex];
      task.status = newStatus;

      // Automatically sync percentage on complete
      if (newStatus === "Complete" || newStatus === "Approved") {
        task.pct = 100;
      } else if (newStatus === "Not Started") {
        task.pct = 0;
      } else if (task.pct === 0 && newStatus === "In Progress") {
        task.pct = 25;
      }

      recalculateProjectProgress(project);
      saveData();
      render();
    }

    function updateTaskProgress(projectId, taskIndex, newPct) {
      const project = PORTFOLIO_DATA.find(p => p.id === projectId);
      if (!project || !project.tasks[taskIndex]) return;

      const task = project.tasks[taskIndex];
      task.pct = Math.min(100, Math.max(0, Number(newPct)));

      if (task.pct === 100 && task.status !== "Approved") {
        task.status = "Complete";
      } else if (task.pct > 0 && task.pct < 100 && task.status !== "Overdue" && task.status !== "Needs Review") {
        task.status = "In Progress";
      } else if (task.pct === 0 && task.status !== "Overdue") {
        task.status = "Not Started";
      }

      recalculateProjectProgress(project);
      saveData();
      render();
    }

    function deleteTask(projectId, taskIndex) {
      const project = PORTFOLIO_DATA.find(p => p.id === projectId);
      if (!project) return;
      if (confirm(`Delete deliverable "${project.tasks[taskIndex].name}"?`)) {
        project.tasks.splice(taskIndex, 1);

      document.getElementById("task-form-project-id").value = projectId;

      document.getElementById("task-modal-title").innerHTML = `<i data-lucide="edit-3" class="w-4 h-4 text-emerald-400"></i> Edit Deliverable (${projectId})`;

    function closeTaskModal() {
      document.getElementById("task-modal").classList.add("hidden");

    function saveTaskForm(e) {
      e.preventDefault();
      const projectId = document.getElementById("task-form-project-id").value;
      const taskIndex = Number(document.getElementById("task-form-task-index").value);
      const project = PORTFOLIO_DATA.find(p => p.id === projectId);
      if (!project) return;

      const newTaskData = {
        name: document.getElementById("task-form-name").value.trim(),
        owner: document.getElementById("task-form-owner").value.trim(),
        due: document.getElementById("task-form-due").value.trim() || "TBC",
        status: document.getElementById("task-form-status").value,
        pct: Number(document.getElementById("task-form-pct").value)
      };

      if (taskIndex === -1) {
        // Add new
        project.tasks.push(newTaskData);
      } else {
        // Edit existing
        project.tasks[taskIndex] = newTaskData;
      }

      recalculateProjectProgress(project);
      saveData();
      closeTaskModal();
      render();
    }

    function getHealthPill(health) {

        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> On Track
      </span>`;
    }

    function renderProgressRing(pct, size = 64, stroke = 5) {
      const radius = (size - stroke) / 2;
      const circumference = radius * 2 * Math.PI;
      const offset = circumference - (pct / 100) * circumference;
      
      let strokeColor = "#10b981";
      if (pct < 30) strokeColor = "#f43f5e";
      else if (pct < 60) strokeColor = "#f59e0b";

      return `
        <div class="relative inline-flex items-center justify-center" style="width: ${size}px; height: ${size}px;">
          <svg width="${size}" height="${size}" class="transform -rotate-90">
            <circle class="circle-bg" stroke-width="${stroke}" fill="transparent" r="${radius}" cx="${size/2}" cy="${size/2}"/>
            <circle class="circle-fill" stroke="${strokeColor}" stroke-width="${stroke}" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" fill="transparent" r="${radius}" cx="${size/2}" cy="${size/2}"/>
          </svg>
          <span class="absolute font-mono text-xs font-bold text-slate-200">${pct}%</span>
        </div>
      `;
    }

    // Pure client-side CRC32 calculation table
    const CRC_TABLE = (() => {
      let c;
      const table = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {
        c = n;
        for (let k = 0; k < 8; k++) {
          c = ((c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1));
        }
        table[n] = c;
      }
      return table;
    })();

    function crc32(uint8arr) {
      let crc = 0 ^ (-1);
      for (let i = 0; i < uint8arr.length; i++) {
        crc = (crc >>> 8) ^ CRC_TABLE[(crc ^ uint8arr[i]) & 0xFF];
      }
      return (crc ^ (-1)) >>> 0;
    }

    // Pure client-side uncompressed ZIP file packager (ZIP_STORED: method 0)
    function buildZipSync(fileMap) {
      const parts = [];
      const cdEntries = [];
      let offset = 0;

      const encoder = new TextEncoder();

      for (const [filename, uint8data] of Object.entries(fileMap)) {
        const fnameBytes = encoder.encode(filename);
        const crc = crc32(uint8data);
        const size = uint8data.length;

        // Local File Header (30 bytes + name)
        const localHeader = new Uint8Array(30 + fnameBytes.length);
        const lView = new DataView(localHeader.buffer);
        lView.setUint32(0, 0x04034b50, true);  // Local signature
        lView.setUint16(4, 20, true);          // Version needed (2.0)
        lView.setUint16(6, 0, true);           // General purpose bit flag
        lView.setUint16(8, 0, true);           // Compression method (0 = STORED)
        lView.setUint16(10, 0, true);          // Last mod file time
        lView.setUint16(12, 0, true);          // Last mod file date
        lView.setUint32(14, crc, true);        // CRC-32
        lView.setUint32(18, size, true);       // Compressed size
        lView.setUint32(22, size, true);       // Uncompressed size
        lView.setUint16(26, fnameBytes.length, true); // Filename length
        lView.setUint16(28, 0, true);          // Extra field length
        localHeader.set(fnameBytes, 30);

        parts.push(localHeader);
        parts.push(uint8data);

        // Central Directory Entry (46 bytes + name)
        const cdHeader = new Uint8Array(46 + fnameBytes.length);
        const cView = new DataView(cdHeader.buffer);
        cView.setUint32(0, 0x02014b50, true);  // Central dir signature
        cView.setUint16(4, 20, true);          // Version made by
        cView.setUint16(6, 20, true);          // Version needed
        cView.setUint16(8, 0, true);           // Flags
        cView.setUint16(10, 0, true);          // Compression method
        cView.setUint16(12, 0, true);          // Time
        cView.setUint16(14, 0, true);          // Date
        cView.setUint32(16, crc, true);        // CRC-32
        cView.setUint32(20, size, true);       // Compressed size
        cView.setUint32(24, size, true);       // Uncompressed size
        cView.setUint16(28, fnameBytes.length, true); // Name length
        cView.setUint16(30, 0, true);          // Extra field length
        cView.setUint16(32, 0, true);          // Comment length
        cView.setUint16(34, 0, true);          // Disk number start
        cView.setUint16(36, 0, true);          // Internal file attributes
        cView.setUint32(38, 0, true);          // External file attributes
        cView.setUint32(42, offset, true);     // Relative offset of local header
        cdHeader.set(fnameBytes, 46);

        cdEntries.push(cdHeader);
        offset += localHeader.length + uint8data.length;
      }

      const cdOffset = offset;
      let cdSize = 0;
      for (const entry of cdEntries) {
        parts.push(entry);
        cdSize += entry.length;
      }

      // End of Central Directory Record (22 bytes)
      const eocd = new Uint8Array(22);
      const eView = new DataView(eocd.buffer);
      eView.setUint32(0, 0x06054b50, true);    // EOCD signature
      eView.setUint16(4, 0, true);             // Number of this disk
      eView.setUint16(6, 0, true);             // Disk where central directory starts
      eView.setUint16(8, cdEntries.length, true);  // Number of central directory records on this disk
      eView.setUint16(10, cdEntries.length, true); // Total number of central directory records
      eView.setUint32(12, cdSize, true);       // Size of central directory
      eView.setUint32(16, cdOffset, true);     // Offset of central directory
      eView.setUint16(20, 0, true);            // Comment length
      parts.push(eocd);

      return new Blob(parts, { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    }

    function base64ToUint8(base64) {
      const binaryString = atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes;
    }

  const buildCell = (val, styleId, typeOverride) => {
    if (val === null || val === undefined || val === "") {
      return '<Cell ss:StyleID="' + styleId + '"><Data ss:Type="String">-</Data></Cell>';
    }

    if (typeOverride === "Number" || typeof val === "number") {
      return '<Cell ss:StyleID="' + styleId + '"><Data ss:Type="Number">' + val + '</Data></Cell>';
    }

    // Check if numeric string
    if (typeof val === "string" && val.trim() !== "" && !isNaN(val) && !val.includes("/") && !val.includes("-")) {
      return '<Cell ss:StyleID="' + styleId + '"><Data ss:Type="Number">' + Number(val) + '</Data></Cell>';
    }

    return '<Cell ss:StyleID="' + styleId + '"><Data ss:Type="String">' + escapeXML(val) + '</Data></Cell>';
  };

  // Row 1: Title
  xml += '   <Row ss:Height="28">\r\n';
  xml += '    <Cell ss:Index="2" ss:MergeAcross="5" ss:StyleID="sTitle"><Data ss:Type="String">Hermit Projects Tracking</Data></Cell>\r\n';
  xml += '    <Cell ss:Index="11" ss:MergeAcross="3" ss:StyleID="sLabel"><Data ss:Type="String">Executive Master Ledger</Data></Cell>\r\n';
  xml += '   </Row>\r\n';

  // Row 2: Company & KPI Summary
  xml += '   <Row ss:Height="22">\r\n';
  xml += '    <Cell ss:Index="2" ss:StyleID="sLabel"><Data ss:Type="String">Company Name:</Data></Cell>\r\n';
  xml += '    <Cell ss:Index="3" ss:MergeAcross="2" ss:StyleID="sSubtitle"><Data ss:Type="String">Hermit Sustainability Advisory</Data></Cell>\r\n';
  xml += '    <Cell ss:Index="7" ss:StyleID="sLabel"><Data ss:Type="String">Report Date:</Data></Cell>\r\n';
  xml += '    <Cell ss:Index="8" ss:StyleID="Default"><Data ss:Type="String">' + new Date().toLocaleDateString() + '</Data></Cell>\r\n';
  xml += '    <Cell ss:Index="10" ss:StyleID="sLabel"><Data ss:Type="String">Active Mandates:</Data></Cell>\r\n';
  xml += '    <Cell ss:Index="11" ss:StyleID="sProjRowCenter"><Data ss:Type="Number">' + totalProjects + '</Data></Cell>\r\n';
  xml += '    <Cell ss:Index="13" ss:StyleID="sLabel"><Data ss:Type="String">Planned Hours:</Data></Cell>\r\n';
  xml += '    <Cell ss:Index="14" ss:StyleID="sProjRowNumber"><Data ss:Type="Number">' + totalEstHours + '</Data></Cell>\r\n';
  xml += '   </Row>\r\n';

  // Row 3: Blank separator
  xml += '   <Row ss:Height="12"/>\r\n';

  // Row 4: Category Section Header
  xml += '   <Row ss:Height="22">\r\n';
  xml += '    <Cell ss:Index="4" ss:MergeAcross="4" ss:StyleID="sCategoryHeader"><Data ss:Type="String">Projects</Data></Cell>\r\n';
  xml += '    <Cell ss:Index="10" ss:MergeAcross="1" ss:StyleID="sCategoryHeader"><Data ss:Type="String">Deliverables</Data></Cell>\r\n';
  xml += '    <Cell ss:Index="12" ss:MergeAcross="2" ss:StyleID="sCategoryHeader"><Data ss:Type="String">Cost / Hours</Data></Cell>\r\n';
  xml += '   </Row>\r\n';

  // Row 5: Column Headers
  const colHeaders = [
    "",
    "Status",
    "Priority",
    "Proposed Project + Task Titles",
    "Task Description",
    "Task Owner",
    "Start Date",
    "End Date",
    "# of Days",
    "Deliverable",
    "% Complete",
    "Fixed Cost",
    "Est. Hours",
    "Actual Hours"
  ];
  xml += '   <Row ss:Height="26">\r\n';
  for (let c = 1; c <= 13; c++) {
    xml += '    <Cell ss:Index="' + (c + 1) + '" ss:StyleID="sColHeader"><Data ss:Type="String">' + escapeXML(colHeaders[c]) + '</Data></Cell>\r\n';
  }
  xml += '   </Row>\r\n';

  // Render Data Rows (starting from row index 6 of template, where project rows begin)
  let zebraCounter = 0;
  for (let r = 6; r < rows.length; r++) {
    const row = rows[r];
    const isPrioRow = Boolean(row[2] && String(row[2]).trim() !== "");
    const isDropdownSection = Boolean(row[1] && String(row[1]).includes("DROPDOWN"));

    if (isDropdownSection) {
      break; // Handled separately below
    }

    // Skip empty spacer rows
    const hasData = row.slice(1, 14).some(cell => cell !== null && cell !== undefined && String(cell).trim() !== "");
    if (!hasData) {
      xml += '   <Row ss:Height="12"/>\r\n';
      continue;
    }

    if (isPrioRow) {
      // Project Banner Row
      xml += '   <Row ss:Height="24">\r\n';
      xml += '    ' + buildCell("", "sProjRow") + '\r\n';
      xml += '    ' + buildCell(row[1], "sProjRowCenter") + '\r\n';
      xml += '    ' + buildCell(row[2], "sProjRowCenter") + '\r\n';
      xml += '    ' + buildCell(row[3], "sProjRow") + '\r\n';
      xml += '    ' + buildCell(row[4], "sProjRow") + '\r\n';
      xml += '    ' + buildCell(row[5], "sProjRow") + '\r\n';
      xml += '    ' + buildCell(row[6], "sProjRowCenter") + '\r\n';
      xml += '    ' + buildCell(row[7], "sProjRowCenter") + '\r\n';
      xml += '    ' + buildCell(row[8], "sProjRowCenter", "Number") + '\r\n';
      xml += '    ' + buildCell(row[9], "sProjRow") + '\r\n';
      xml += '    ' + buildCell(row[10], "sProjRowPct", "Number") + '\r\n';
      xml += '    ' + buildCell(row[11], "sProjRowCurrency", "Number") + '\r\n';
      xml += '    ' + buildCell(row[12], "sProjRowNumber", "Number") + '\r\n';
      xml += '    ' + buildCell(row[13], "sProjRowNumber", "Number") + '\r\n';
      xml += '   </Row>\r\n';
      zebraCounter = 0; // reset zebra for tasks
    } else {
      // Task Data Row with Zebra Striping
      const styleBase = (zebraCounter % 2 === 0) ? "sDataWhite" : "sDataZebra";
      zebraCounter++;

      xml += '   <Row ss:Height="21">\r\n';
      xml += '    ' + buildCell("", styleBase) + '\r\n';
      xml += '    ' + buildCell(row[1], styleBase + "Center") + '\r\n';
      xml += '    ' + buildCell(row[2], styleBase + "Center") + '\r\n';
      xml += '    ' + buildCell(row[3], styleBase) + '\r\n';
      xml += '    ' + buildCell(row[4], styleBase) + '\r\n';
      xml += '    ' + buildCell(row[5], styleBase) + '\r\n';
      xml += '    ' + buildCell(row[6], styleBase + "Center") + '\r\n';
      xml += '    ' + buildCell(row[7], styleBase + "Center") + '\r\n';
      xml += '    ' + buildCell(row[8], styleBase + "Center", "Number") + '\r\n';
      xml += '    ' + buildCell(row[9], styleBase) + '\r\n';
      xml += '    ' + buildCell(row[10], styleBase + "Pct", "Number") + '\r\n';
      xml += '    ' + buildCell(row[11], styleBase + "Currency", "Number") + '\r\n';
      xml += '    ' + buildCell(row[12], styleBase + "Number", "Number") + '\r\n';
      xml += '    ' + buildCell(row[13], styleBase + "Number", "Number") + '\r\n';
      xml += '   </Row>\r\n';
    }
  }

  // Grand Total Row at bottom with bold text & double bottom border
  xml += '   <Row ss:Height="26">\r\n';
  xml += '    <Cell ss:Index="2" ss:MergeAcross="2" ss:StyleID="sGrandTotalCenter"><Data ss:Type="String">GRAND TOTALS</Data></Cell>\r\n';
  xml += '    <Cell ss:Index="5" ss:MergeAcross="6" ss:StyleID="sGrandTotal"><Data ss:Type="String">' + totalProjects + ' Mandates | ' + totalTasks + ' Deliverables (' + completedTasks + ' Complete, ' + overdueTasks + ' Overdue)</Data></Cell>\r\n';
  xml += '    <Cell ss:Index="12" ss:StyleID="sGrandTotalCurrency"><Data ss:Type="Number">0</Data></Cell>\r\n';
  xml += '    <Cell ss:Index="13" ss:StyleID="sGrandTotalNumber"><Data ss:Type="Number">' + totalEstHours + '</Data></Cell>\r\n';
  xml += '    <Cell ss:Index="14" ss:StyleID="sGrandTotalNumber"><Data ss:Type="Number">' + totalActualHours + '</Data></Cell>\r\n';
  xml += '   </Row>\r\n';

  // Spacer
  xml += '   <Row ss:Height="16"/>\r\n';

  // Dropdown Keys Reference Section
  xml += '   <Row ss:Height="22">\r\n';
  xml += '    <Cell ss:Index="2" ss:MergeAcross="2" ss:StyleID="sRefHeader"><Data ss:Type="String">DROPDOWN KEYS REFERENCE</Data></Cell>\r\n';
  xml += '   </Row>\r\n';
  xml += '   <Row ss:Height="20">\r\n';
  xml += '    <Cell ss:Index="2" ss:StyleID="sColHeader"><Data ss:Type="String">Priority</Data></Cell>\r\n';
  xml += '    <Cell ss:Index="4" ss:StyleID="sColHeader"><Data ss:Type="String">Status</Data></Cell>\r\n';
  xml += '   </Row>\r\n';

  const refKeys = [
    ["High", "Complete"],
    ["Medium", "In Progress"],
    ["Low", "Overdue"],
    ["-", "Not Started"],
    ["-", "On Hold"],
    ["-", "Needs Review"],
    ["-", "Approved"]
  ];

  refKeys.forEach((k, idx) => {
    const s = (idx % 2 === 0) ? "sDataWhiteCenter" : "sDataZebraCenter";
    xml += '   <Row ss:Height="19">\r\n';
    xml += '    <Cell ss:Index="2" ss:StyleID="' + s + '"><Data ss:Type="String">' + k[0] + '</Data></Cell>\r\n';
    xml += '    <Cell ss:Index="4" ss:StyleID="' + s + '"><Data ss:Type="String">' + k[1] + '</Data></Cell>\r\n';
    xml += '   </Row>\r\n';
  });

  xml += '  </Table>\r\n';
  xml += ' </Worksheet>\r\n';
  xml += '</Workbook>';

  // Pure client-side download using application/vnd.ms-excel with .xls extension
  const blob = new Blob([xml], { type: "application/vnd.ms-excel;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.setAttribute("href", url);
  link.setAttribute("download", "Hermit_Projects_Status_Tracker.xls");
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}


        function exportCSV() {
      const escapeCSV = (val) => {
        if (val === null || val === undefined) return "";
        let str = String(val);
        if (str.includes(",") || str.includes('"') || str.includes("\n") || str.includes("\r")) {
          return '"' + str.replace(/"/g, '""') + '"';
        }
        return str;
      };

      // Deep clone original template rows so it starts with the exact layout, dates, days, and hours
      const rows = ORIGINAL_CSV_TEMPLATE.map(r => [...r]);

      // Overlay live updates (status, % complete, owner) from current PORTFOLIO_DATA
      PORTFOLIO_DATA.forEach(p => {
        const pName = (p.shortName || p.name || "").trim().toLowerCase();
        
        // Find matching project row in template
        const pRowIdx = rows.findIndex(r => r[3] && String(r[3]).trim().toLowerCase() === pName && r[2]);
        if (pRowIdx !== -1) {
          if (p.completion !== undefined) {
            rows[pRowIdx][10] = (Number(p.completion) / 100);
          }
        }

        // Find matching task rows in template
        if (p.tasks && p.tasks.length > 0) {
          p.tasks.forEach(t => {
            const tName = (t.name || "").trim().toLowerCase();
            const tRowIdx = rows.findIndex(r => r[3] && String(r[3]).trim().toLowerCase() === tName && !r[2]);
            if (tRowIdx !== -1) {
              if (t.status) rows[tRowIdx][1] = t.status;
              if (t.pct !== undefined) rows[tRowIdx][10] = (Number(t.pct) / 100);
              if (t.owner) rows[tRowIdx][5] = t.owner;
            }
          });
        }
      });

      // Generate CSV string with Windows CRLF
      const csvContent = rows.map(r => r.map(cell => escapeCSV(cell)).join(",")).join("\r\n");

      // Include UTF-8 BOM so Excel opens with correct character encoding and formatting
      const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", "Hermit_Projects_Tracking.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    // --- MAIN RENDER ROUTER ---
    function render() {
      const container = document.getElementById("viewport");
      if (currentTab === "overview") container.innerHTML = renderOverviewView();
      else if (currentTab === "projects") container.innerHTML = renderProjectsView();
      else if (currentTab === "timeline") container.innerHTML = renderTimelineView();
      else if (currentTab === "tasks") container.innerHTML = renderTasksView();
      else if (currentTab === "alerts") container.innerHTML = renderAlertsView();
      else if (currentTab === "funding") container.innerHTML = renderFundingView();

      updateSidebarBadges();
      lucide.createIcons();
    }

    // --- INITIALIZATION ---
    document.addEventListener("DOMContentLoaded", () => {
      loadData();
      setTab("overview");
    });
  </script>
